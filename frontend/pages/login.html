<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTrack – Login</title>
    <link rel="stylesheet" href="../css/global.css">
</head>

<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">💊</div>
                <h1>PharmaTrack</h1>
                <p>Pharmacy Inventory &amp; POS System</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="your@email.com"
                        autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••"
                        autocomplete="current-password" required>
                </div>

                <p class="error-msg" id="login-error" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        // ── Redirect if already logged in ────────────────────────
        const CONFIG = {
            API_BASE: (() => {
                const host = window.location.hostname;
                // Opened as a local file (file://) or via Live Server
                if (host === 'localhost' || host === '127.0.0.1' || host === '') {
                    return 'http://localhost:5000/api';
                }
                // Deployed version
                return '/api';
            })(),
            TOKEN_KEY:     'pharmatrack_token',
            USER_KEY:      'pharmatrack_user',
            TOAST_TIMEOUT: 4000
        };

        const API = {
            async request(endpoint, options = {}) {
                const config = { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } };
                const res = await fetch(`${CONFIG.API_BASE}${endpoint}`, config);
                return res.json();
            },
            post(endpoint, body) { return this.request(endpoint, { method: 'POST', body: JSON.stringify(body) }); }
        };

        const Auth = {
            getToken() { return localStorage.getItem(CONFIG.TOKEN_KEY); },
            saveSession(token, user) {
                localStorage.setItem(CONFIG.TOKEN_KEY, token);
                localStorage.setItem(CONFIG.USER_KEY, JSON.stringify(user));
            }
        };

        const Toast = {
            show(msg, type = 'info') {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML = `<span>${type === 'error' ? '❌' : 'ℹ️'}</span><div><div class="toast-title">${type}</div><div class="toast-message">${msg}</div></div>`;
                c.appendChild(t);
                setTimeout(() => t.remove(), 4000);
            }
        };

        // If already authenticated, redirect appropriately
        if (Auth.getToken()) {
            const user = JSON.parse(localStorage.getItem(CONFIG.USER_KEY) || '{}');
            window.location.href = user.role === 'cashier' ? 'pos.html' : 'dashboard.html';
        }

        // ── Login Form ────────────────────────────────────────────
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            btn.disabled = true;
            btn.textContent = 'Signing in…';
            errorEl.textContent = '';

            try {
                const result = await API.post('/auth/login', { email, password });

                if (result.success) {
                    Auth.saveSession(result.token, result.user);

                    // Role-based redirect
                    const role = result.user.role;
                    if (role === 'cashier') {
                        window.location.href = 'pos.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    errorEl.textContent = result.message || 'Login failed.';
                    btn.disabled = false;
                    btn.textContent = 'Sign In';
                }
            } catch (err) {
                errorEl.textContent = 'Connection error. Is the server running?';
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });
    </script>
</body>

</html>
